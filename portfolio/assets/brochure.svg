<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460" role="img" aria-label="Tri-fold brochure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a231a" />
      <stop offset="1" stop-color="#03100c" />
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#42ffad" stop-opacity="0.26" />
      <stop offset="1" stop-color="#42ffad" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9cdc3" />
      <stop offset="1" stop-color="#8fa79b" />
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9f4ee" />
      <stop offset="1" stop-color="#c6d8cf" />
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d2e2da" />
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42ffad" />
      <stop offset="1" stop-color="#0f7a58" />
    </linearGradient>
    <linearGradient id="pic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fe0a2" />
      <stop offset="1" stop-color="#0a503b" />
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="600" height="460" rx="26" fill="url(#bg)" />
  <rect width="600" height="460" rx="26" fill="url(#glow)" />

  <g transform="rotate(-6 300 228)" filter="url(#ds)">
    <rect x="138" y="102" width="104" height="252" rx="3" fill="url(#p1)" />
    <rect x="242" y="102" width="116" height="252" rx="3" fill="url(#p2)" />
    <rect x="358" y="102" width="104" height="252" rx="3" fill="url(#p3)" />

    <rect x="242" y="102" width="10" height="252" fill="#062018" opacity="0.28" />
    <rect x="358" y="102" width="10" height="252" fill="#062018" opacity="0.22" />

    <rect x="158" y="126" width="64" height="6" rx="3" fill="#0f2f24" opacity="0.5" />
    <rect x="158" y="142" width="64" height="4" rx="2" fill="#0f2f24" opacity="0.28" />
    <rect x="158" y="152" width="48" height="4" rx="2" fill="#0f2f24" opacity="0.28" />

    <rect x="262" y="126" width="76" height="70" rx="2" fill="url(#pic)" />
    <rect x="262" y="208" width="76" height="6" rx="3" fill="#0f2f24" opacity="0.5" />
    <rect x="262" y="222" width="76" height="4" rx="2" fill="#0f2f24" opacity="0.3" />
    <rect x="262" y="232" width="56" height="4" rx="2" fill="#0f2f24" opacity="0.3" />

    <rect x="376" y="118" width="68" height="26" rx="4" fill="url(#band)" />
    <rect x="376" y="158" width="68" height="78" rx="2" fill="url(#pic)" />
    <rect x="376" y="248" width="68" height="6" rx="3" fill="#0f2f24" opacity="0.5" />
    <rect x="376" y="262" width="68" height="4" rx="2" fill="#0f2f24" opacity="0.3" />
    <rect x="376" y="272" width="46" height="4" rx="2" fill="#0f2f24" opacity="0.3" />
  </g>

  <circle cx="506" cy="92" r="3.2" fill="#baffdf" opacity="0.85" />
  <circle cx="84" cy="360" r="2.4" fill="#baffdf" opacity="0.6" />
  <circle cx="528" cy="348" r="2" fill="#42ffad" opacity="0.55" />
</svg>
